version: 2

# @rmartz/pr-policy is public on npmjs, so Dependabot needs no registry block or
# DEPENDABOT_PACKAGES_TOKEN secret to see new CLI versions.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # First-party `rmartz/*` actions and reusable workflows are exempt from the
      # default release cooldown (see the npm entry below); third-party actions
      # keep it.
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      # Action bumps only touch this repo's own CI workflows and the setup-node step,
      # never the policy the Action enforces: `chore` → no release.
      prefix: chore
      include: scope
    groups:
      # Catch-all, majors included (repository checklist default).
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      # Daily, so a new @rmartz/pr-policy release reaches the Action (and its
      # consumers) within a day instead of up to a week.
      interval: daily
    commit-message:
      # Production deps ship inside the released Action, so their bump must cut a
      # release: `fix` (→ patch). dependabot-release-type then rewrites the title to
      # mirror the CLI's semver bump (minor → feat(deps), major → feat(deps)! +
      # breaking-change label). Dev deps never ship: `chore`. (rmartz/ai#82.)
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated so a reformatting bump can't hide in a catch-all.
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
      # A recorded case-by-case deviation from the catch-all default: the CLI is the
      # only production dep, and its major must fall out to its own PR so a human
      # reviews the breaking Action release (bot-automerge never merges a major).
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    cooldown:
      # Since 2026-07-14 Dependabot waits 3 days after a release before proposing
      # it. First-party `@rmartz/*` packages (the @rmartz/pr-policy CLI among them)
      # are published from our own repos with provenance, so the wait buys no
      # supply-chain safety and just defeats the daily schedule above. Exempting
      # them lets a new CLI version arrive on the next daily run. Every third-party
      # dependency keeps the default.
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - '@rmartz/*'
