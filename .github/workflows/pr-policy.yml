name: pr-policy

# Dogfoods this Action on its own PRs, through the exact caller shape consumers
# use (docs/consuming.md) except `uses: ./`. On pull_request_target the checkout is
# the BASE ref, so the action code that runs is main's — never the PR's — and the
# CLI only reads the PR through the API. That is what makes the write token safe.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # Re-run when pr-lifecycle posts its pr-lifecycle/sign-off status. A status
  # workflow runs from the default branch too, so the same safety holds.
  status:
  # Re-run when the pr-lifecycle caller finishes: it writes the UAT label with
  # GITHUB_TOKEN, which starts no `labeled` run, so require-uat-label would
  # otherwise never see it. Like `status`, this runs from the default branch.
  workflow_run:
    workflows: [pr-lifecycle]
    types: [completed]

permissions:
  checks: write # post the pr-policy check-run
  pull-requests: write # write the labels pr-policy owns (CI approval needed)
  contents: read # read changed files at the merge base and head
  statuses: write # post the pr-policy commit status and one per policy check (pr-policy / <check>)

concurrency:
  # Latest-wins per PR: a label action fires a burst of events, and the newest
  # label state should be the one that posts. A status or workflow_run event has no PR
  # number, so it groups by its commit.
  group: pr-policy-${{ github.event.pull_request.number || github.event.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy (evaluate)
    # Only pr-lifecycle's sign-off status re-runs the gate; skip every other one.
    if: github.event_name != 'status' || github.event.context == 'pr-lifecycle/sign-off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          pr: ${{ github.event.pull_request.number }}
          # Hold a PR with no UAT label, so every merge has an explicit UAT
          # determination (pr-lifecycle keeps one on every open PR).
          require-uat-label: true
          # Retitle a Dependabot linter/formatter bump to ci(...), the type the
          # pr-policy title check requires for it, instead of blocking on a hand edit.
          retitle-dependabot-ci: true
          # This repo ships only an Action; there is nothing to user-test.
          skip-uat: true
