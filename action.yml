name: 'pr-policy'
description: 'Run the @rmartz/pr-policy read-only PR content checks and post the blocking pr-policy verdict (a check-run and a matching commit status).'
author: 'rmartz'

branding:
  icon: 'shield'
  color: 'blue'

# A composite action that wraps the @rmartz/pr-policy CLI. The consuming repo's
# caller job runs on pull_request_target and grants checks:write +
# pull-requests:write + contents:read + statuses:write. The CLI reads the PR's
# title, labels, and changed files — including both sides of every changed
# workflow file — through the API, then posts the `pr-policy` verdict (a check-run
# and a matching commit status), writes the labels it owns (`CI approval needed`),
# and posts one informational commit status per check (`pr-policy / <check>`).
# The `pr-policy` status is what keeps the gate working when GitHub supersedes the
# check suite the check-run landed in (rmartz/pr-policy#24). It never checks out or executes
# PR code, which is what makes the elevated pull_request_target token safe here.
#
# The CLI version is the one pinned in this action's package-lock.json (bumped by
# Dependabot + released as a new action version), so a given action ref enforces a
# reproducible policy. See docs/design/integration-contract.md.

inputs:
  pr:
    description: >-
      PR number to evaluate. Pass the pull_request_target event's number from your
      caller (github.event.pull_request.number) — see docs/consuming.md. This text
      must not contain a template expression: an action manifest validates
      expressions in input metadata against a context where github is unavailable.
    required: true
  token:
    description: >-
      Token used to read the PR, post the pr-policy check-run and commit status
      and the per-check statuses, and write labels. Defaults to the workflow
      GITHUB_TOKEN, which needs checks:write + pull-requests:write +
      contents:read + statuses:write. Without statuses:write the pr-policy
      status can't be posted, and the PR can be left blocked by a green check
      whose check suite GitHub has superseded. The CLI installs from npmjs with
      no auth, so `packages: read` is not needed.
    required: false
    default: ${{ github.token }}
  node-version:
    description: 'Node.js version to run the CLI under.'
    required: false
    default: '22'
  statuses:
    description: >-
      Post one commit status per policy check (e.g. "pr-policy / title") so the
      PR's status list shows which check failed, which is waiting on a human
      sign-off, and which passed. Needs statuses:write on the calling job; without
      it the action warns and carries on. Set to "false" to turn them off. This
      never affects the pr-policy status itself, which is always posted.
    required: false
    default: 'true'
  status-context:
    description: >-
      Prefix for the per-check status names ("<prefix> / <check>"). Set a distinct
      value when a workflow runs this action more than once.
    required: false
    default: 'pr-policy'
  skip-uat:
    description: >-
      Don't run the UAT gate, for a repo with no user-acceptance testing (for
      example one that ships only a library or an Action). The title and
      CI-change checks are unchanged, and no "pr-policy / uat" status is posted.
      Set this in the caller workflow on the default branch; a
      pull_request_target caller runs from there, so a PR can't turn off a gate
      it would otherwise wait on.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    # Install the pinned CLI into this action's own directory — $GITHUB_ACTION_PATH
    # holds this action's package.json, lockfile, and .npmrc (which pins the
    # @rmartz scope to npmjs) — not the consumer workspace. The package is public
    # on npmjs, so the install needs no token.
    - name: Install pinned @rmartz/pr-policy
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    # The runner script lives in this action's directory, so its import of
    # @rmartz/pr-policy resolves to the copy just installed there. It does what
    # `pr-policy evaluate` does (including the pr-policy commit status), then
    # posts one commit status per check.
    - name: Evaluate PR policy
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_STATUSES: ${{ inputs.statuses }}
        INPUT_STATUS_CONTEXT: ${{ inputs.status-context }}
        INPUT_SKIP_UAT: ${{ inputs.skip-uat }}
      run: node "${GITHUB_ACTION_PATH}/scripts/evaluate.mjs"
